; Direksiyon enkoderi tezgah testi — Nucleo-F767ZI
; İkinci E6B2-CWZ6C, YAZILIM kuadratürü (traksiyon enkoderi donanım TIM4'te;
; burada boş kuadratür sayacı kalmadığı için EXTI ile sayılıyor — config.h §7).
; Kart üstünde ST-LINK/V2-1 var: harici dongle GEREKMEZ.
[env:nucleo_f767zi]
platform        = ststm32
board           = nucleo_f767zi
framework       = arduino
upload_protocol = stlink
monitor_speed   = 115200
