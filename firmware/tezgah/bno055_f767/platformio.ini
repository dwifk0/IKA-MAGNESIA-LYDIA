; BNO055 tezgah testi — Nucleo-F767ZI
; Kart üstünde ST-LINK/V2-1 var: harici dongle GEREKMEZ.
; (ika-tezgah-blackpill'deki bozuk dongle sorunu bu kartta yaşanmıyor.)
[env:nucleo_f767zi]
platform        = ststm32
board           = nucleo_f767zi
framework       = arduino
; ⚠ upload_protocol WSL'de ise yaramaz (USB gecisi yok). Yukleme:
;   cp .pio/build/nucleo_f767zi/firmware.bin /mnt/d/
upload_protocol = stlink
monitor_speed   = 115200
